server {
    listen 80;
    server_name observability.worktual.tech 82.113.72.157;
    return 301 https://observability.worktual.tech$request_uri;
}

server {
    listen 443 ssl;
    server_name observability.worktual.tech;

    ssl_certificate     /etc/ssl/worktual.tech/STAR.worktual.tech.fullchain.pem;
    ssl_certificate_key /etc/ssl/worktual.tech/STAR.worktual.tech_key.txt;

    root /opt/unified-ops/frontend/dist;
    index index.html;

    # All API traffic — never hits SPA try_files (avoids /servers 301 cache issues)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        add_header Cache-Control "no-store" always;
    }

    # Legacy health checks (optional)
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
